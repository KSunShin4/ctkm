name: Input Reader Validation

on:
  push:
    branches:
      - fix/input-readers-baseline
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    env:
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q main.py backend modules tests
      - name: Run full test suite
        run: pytest -q
