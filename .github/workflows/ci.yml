name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ""
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-password
      ADMIN_SESSION_SECRET: ci-session-secret-ci-session-secret
      HEAVY_JOB_QUEUE_SIZE: "5"
      EXPIRATION_CONCURRENCY: "5"
      EXPIRATION_CACHE_SIZE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements_backend.txt
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q main.py main_core.py backend modules tests
      - name: Run test suite
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Audit production frontend dependencies
        run: npm --prefix frontend audit --omit=dev --audit-level=high
      - name: Build frontend
        run: npm --prefix frontend run build

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t ctkm-pipeline:ci .
      - name: Smoke production image and hardened health contract
        run: |
          docker run -d --name ctkm-ci -p 18000:8000 \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=ci-admin-password \
            -e ADMIN_SESSION_SECRET=ci-session-secret-ci-session-secret \
            ctkm-pipeline:ci
          trap 'docker logs ctkm-ci || true; docker rm -f ctkm-ci >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/api/health > /tmp/ctkm-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          cat /tmp/ctkm-health.json
          python3 -c 'import json; d=json.load(open("/tmp/ctkm-health.json")); assert d.get("status")=="ok"; assert d.get("contract_suite")=="v1"; assert d.get("contracts_ok") is True; assert "mapping-result-contract-v1" in d.get("main_facade_hooks", [])'
