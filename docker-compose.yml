version: "3.9"
services:
  backend:
    build: .
    container_name: ctkm-backend
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      - ./:/app
    command: python -m uvicorn backend.main_api:app --host 0.0.0.0 --port 8000
