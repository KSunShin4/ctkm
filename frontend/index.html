<!doctype html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>PharmaOps — Trợ lý vận hành cửa hàng</title></head><body><div id="root"></div><a id="shelf-shortcut" href="/scan-tem?mode=shelf" style="display:none">Kiểm theo kệ</a><script type="module">
if(window.location.pathname.startsWith('/schedule'))import('/src/scheduling-main.jsx')
else if(window.location.pathname.startsWith('/overview')||window.location.pathname.startsWith('/guide')||window.location.pathname.startsWith('/assistant')||window.location.pathname.startsWith('/history')||window.location.pathname.startsWith('/settings'))import('/src/portal-main.jsx')
else if(window.location.pathname.startsWith('/scan-tem')){const mode=new URLSearchParams(window.location.search).get('mode');if(mode==='shelf')import('/src/tag-audit-shelf-main.jsx');else{document.getElementById('shelf-shortcut').style.display='block';import('/src/tag-audit-main.jsx')}}
else import('/src/main.jsx')
</script></body></html>
